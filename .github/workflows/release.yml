name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Surum etiketi (ornek: v1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          # csproj icindeki <Version> ile ayni olmali
          $projVersion = (Select-String -Path SysDash/SysDash.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          if ($tag -ne "v$projVersion") {
            throw "Etiket ($tag) ile csproj surumu (v$projVersion) uyusmuyor."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish SysDash/SysDash.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\SysDash.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item publish/SysDash.exe staging/SysDash.exe
          Copy-Item Installer/Output/SysDashSetup.exe staging/SysDashSetup.exe
          Copy-Item LICENSE staging/LICENSE
          Copy-Item Uninstall.bat staging/Uninstall.bat
          # Portable paket: exe + kaldirma + lisans
          Compress-Archive -Path staging/* -DestinationPath "SysDash-${{ steps.version.outputs.tag }}-win-x64-portable.zip" -Force
          Get-ChildItem *.zip, staging/* | Select-Object Name, Length

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SysDash ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            staging/SysDashSetup.exe
            staging/SysDash.exe
            SysDash-${{ steps.version.outputs.tag }}-win-x64-portable.zip
            staging/LICENSE
