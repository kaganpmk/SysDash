name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SysDash/SysDash.csproj

      - name: Build
        run: dotnet build SysDash/SysDash.csproj -c Release --no-restore

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish SysDash/SysDash.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\SysDash.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysdash-ci
          path: |
            publish/SysDash.exe
            Installer/Output/SysDashSetup.exe
          if-no-files-found: error
