name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore SysDash.slnx
      - name: Publish
        run: dotnet publish SysDash/SysDash.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish
      - name: Zip publish
        run: |
          powershell -Command "Compress-Archive -Path publish\* -DestinationPath artifact.zip"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Create installer (Inno Setup)
        run: |
          "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" Installer\\SysDash.iss /F"SysDashSetup"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifact.zip
          asset_name: SysDash-${{ github.ref_name }}.zip
          asset_content_type: application/zip
      - name: Upload installer asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: SysDashSetup.exe
          asset_name: SysDashSetup-${{ github.ref_name }}.exe
          asset_content_type: application/octet-stream
